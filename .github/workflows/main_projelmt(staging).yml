# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - projelmt

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      # This workflow deploys the `staging` slot, which runs the same App
      # Service startup command as `dev` (`startup.sh`). The repo is a
      # monorepo: the API compiles to apps/api/dist and the SPA to
      # apps/web/dist, so uploading the raw checkout gives App Service nothing
      # it can run - no dist/server.js at the root, no production
      # node_modules, no startup.sh.
      #
      # Assemble the same package shape deploy-projelmt.yml builds, so both
      # slots run identical artifacts.
      - name: Assemble deployment package
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/package"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          cp -r apps/api/dist "$OUT/dist"
          cp apps/api/package.json "$OUT/package.json"

          mkdir -p "$OUT/web"
          cp -r apps/web/dist "$OUT/web/dist"

          cp scripts/startup.sh "$OUT/startup.sh"
          chmod +x "$OUT/startup.sh"

          test -f "$OUT/dist/server.js"      || { echo "::error::missing dist/server.js"; exit 1; }
          test -f "$OUT/web/dist/index.html" || { echo "::error::missing web/dist/index.html"; exit 1; }
          test -x "$OUT/startup.sh"          || { echo "::error::startup.sh is not executable"; exit 1; }

          cd "$OUT"
          node -e "
            const p = require('./package.json');
            delete p.dependencies['@pe/shared'];
            delete p.devDependencies;
            delete p.scripts.dev;
            delete p.scripts.build;
            delete p.scripts.typecheck;
            delete p.scripts.seed;
            p.scripts.start = 'node dist/server.js';
            require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2));
          "
          npm install --omit=dev --no-audit --no-fund

          PUPPETEER_CACHE_DIR="$OUT/puppeteer-cache" \
            npx --yes @puppeteer/browsers install chrome@stable --path "$OUT/puppeteer-cache"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ${{ runner.temp }}/package

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      # download-artifact does not preserve file modes, so startup.sh arrives
      # without its executable bit and App Service cannot run it - the site
      # then answers 503 because nothing is listening. Restore the bit here
      # rather than asserting it, and fail before deploying if the package is
      # incomplete.
      - name: Verify package
        run: |
          set -euo pipefail
          test -f dist/server.js || { echo "::error::dist/server.js missing"; exit 1; }
          test -f web/dist/index.html || { echo "::error::web/dist/index.html missing"; exit 1; }
          test -d node_modules || { echo "::error::node_modules missing"; exit 1; }
          test -f startup.sh || { echo "::error::startup.sh missing"; exit 1; }
          chmod +x startup.sh
          test -x startup.sh || { echo "::error::startup.sh is not executable"; exit 1; }
          echo "Package looks complete."

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'projelmt'
          slot-name: 'staging'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_94771DDFC2A04266A48F94C066A4A66B }}