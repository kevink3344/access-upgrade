# Builds the monorepo and deploys the API + built React app to Azure App Service.
#
# One Web App serves both: the Express API handles /api/*, /health, /swagger,
# and the built React app is served as static files for everything else. Staff
# use a single URL and there is no CORS to configure.
#
# The deploy artifact is deliberately small: only apps/api/dist, the built
# web app, and production node_modules. Uploading the whole repo (the default
# that Azure generates) fails because there is no server.js at the root.

name: Deploy to Azure Web App - projelmt

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'
  AZURE_WEBAPP_NAME: projelmt
  AZURE_WEBAPP_SLOT: dev

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Assemble exactly what Azure needs to run the app.
      - name: Assemble deployment package
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/package"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          # API: compiled output + manifest
          cp -r apps/api/dist "$OUT/dist"
          cp apps/api/package.json "$OUT/package.json"

          # Web: built SPA, served by the API as static files.
          # The parent directory must exist first - `cp` does not create
          # intermediate directories, and fails if $OUT/web is missing.
          mkdir -p "$OUT/web"
          cp -r apps/web/dist "$OUT/web/dist"

          # Fail loudly here rather than after a slow upload.
          test -f "$OUT/dist/server.js"      || { echo "::error::missing dist/server.js"; exit 1; }
          test -f "$OUT/web/dist/index.html" || { echo "::error::missing web/dist/index.html"; exit 1; }

          # Production dependencies only. The workspace protocol for
          # @pe/shared is types-only, so it is not needed at runtime.
          cd "$OUT"
          node -e "
            const p = require('./package.json');
            delete p.dependencies['@pe/shared'];
            delete p.devDependencies;
            delete p.scripts.dev;
            delete p.scripts.build;
            delete p.scripts.typecheck;
            delete p.scripts.seed;
            p.scripts.start = 'node dist/server.js';
            require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2));
          "
          npm install --omit=dev --no-audit --no-fund

          echo "--- package contents ---"
          ls -la
          du -sh node_modules

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ${{ runner.temp }}/package
          retention-days: 5

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Verify package
        run: |
          set -euo pipefail
          test -f dist/server.js || { echo "::error::dist/server.js missing"; exit 1; }
          test -f web/dist/index.html || { echo "::error::web/dist/index.html missing"; exit 1; }
          test -d node_modules || { echo "::error::node_modules missing"; exit 1; }
          echo "Package looks complete."

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_WEBAPP_SLOT }}
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_3D735E8F5F1B4A42BC587B3785481167 }}
